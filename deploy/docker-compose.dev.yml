name: benchmonster-dev
# Local dev database (TimescaleDB), so development never touches production.
#   docker compose -f deploy/docker-compose.dev.yml up -d
# then point .env.local at it (see backend/README.md).
services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: tsdbadmin
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: tsdb
    ports:
      - "5433:5432"
    volumes:
      - devdb:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  devdb:
